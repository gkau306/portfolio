<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gurleen Kaur — Software Engineer</title>
<meta name="description" content="Gurleen Kaur — software engineer in Auckland, NZ. A little pink terminal you navigate with commands.">
<meta name="theme-color" content="#fff5f8">
<meta property="og:title" content="Gurleen Kaur — Software Engineer">
<meta property="og:description" content="A little pink terminal you navigate with commands. Type `projects`.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌸</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,300;0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">

    <aside class="rail">
      <div class="rail-brand">
        <span class="dot-live"></span>
        <span class="rail-name">gurleen<span class="muted">.kaur</span></span>
      </div>

      <nav class="rail-group" aria-label="Sections">
        <p class="rail-label">sections</p>
        <button class="rail-item" data-cmd="about"><span class="rail-key">01</span>about</button>
        <button class="rail-item" data-cmd="projects"><span class="rail-key">02</span>projects</button>
        <button class="rail-item" data-cmd="experience"><span class="rail-key">03</span>experience</button>
        <button class="rail-item" data-cmd="skills"><span class="rail-key">04</span>skills</button>
        <button class="rail-item" data-cmd="awards"><span class="rail-key">05</span>awards</button>
        <button class="rail-item" data-cmd="contact"><span class="rail-key">06</span>contact</button>
      </nav>

      <div class="rail-group">
        <p class="rail-label">shortcuts</p>
        <button class="rail-item ghost" data-cmd="help">help</button>
        <button class="rail-item ghost" data-cmd="clear">clear</button>
      </div>

      <div class="rail-foot">
        <button id="theme-btn" class="theme-btn" type="button" aria-label="Toggle theme">☀ light</button>
        <p class="rail-note">CS + Biology @ UoA<br>Auckland, NZ</p>
      </div>
    </aside>

    <main class="window">
      <div class="titlebar">
        <span class="lights"><i></i><i></i><i></i></span>
        <span class="title">gurleen@portfolio — <span class="muted">zsh</span></span>
        <span class="title-right muted">v2 · no bunnies</span>
      </div>

      <div class="screen" id="screen">
        <div id="output"></div>

        <form id="prompt-form" class="prompt" autocomplete="off">
          <label for="input" class="prompt-label">
            <span class="prompt-user">gurleen</span><span class="prompt-sep">@</span><span class="prompt-host">portfolio</span><span class="prompt-path">~</span><span class="prompt-caret">❯</span>
          </label>
          <input id="input" name="input" type="text" spellcheck="false" autocapitalize="off"
                 autocorrect="off" aria-label="Terminal input" placeholder="type a command… (try: projects)">
        </form>
      </div>

      <div class="statusbar">
        <span><span class="dot-live"></span> online</span>
        <span class="muted">tab cycles commands · ↑↓ history · ctrl-l clears</span>
      </div>
    </main>
  </div>

  <figure id="lightbox" class="lightbox" hidden>
    <img alt="">
    <figcaption></figcaption>
  </figure>

  <script type="module" src="js/app.js"></script>
</body>
</html>
